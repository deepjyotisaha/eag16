<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .timer-container {
            text-align: center;
        }

        #timer {
            font-size: 3em;
            font-weight: bold;
            padding: 20px;
            border: 2px solid #ffffff;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="timer-container">
        <div id="timer">05:00</div>
    </div>

    <script>
        // Set the initial time in seconds (5 minutes = 300 seconds)
        let timeLeft = 300;

        // Function to update the timer display
        function updateTimer() {
            const minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;

            // Add a leading zero to seconds if it's less than 10
            seconds = seconds < 10 ? '0' + seconds : seconds;

            // Update the timer element with the new time
            document.getElementById('timer').innerText = minutes + ':' + seconds;

            // If the timer has reached zero, stop the countdown
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                document.getElementById('timer').innerText = 'Time's up!';
            }

            timeLeft--; // Decrement the time left
        }

        // Call updateTimer function immediately to set the initial display
        updateTimer();

        // Update the timer every second (1000 milliseconds)
        const timerInterval = setInterval(updateTimer, 1000);
    </script>
</body>
</html>
